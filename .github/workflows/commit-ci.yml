name: commit ci
on:
  push:
    branches:
      - '*'
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint

      - name: Configure build environment
        run: |
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      - name: Build Squirrel
        run: ./action-build.sh package

      - name: Install periphery
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/periphery.zip" \
            https://github.com/peripheryapp/periphery/releases/download/3.8.0/periphery-3.8.0.zip
          printf '%s  %s\n' \
            '07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7' \
            "$RUNNER_TEMP/periphery.zip" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/periphery"
          unzip -q "$RUNNER_TEMP/periphery.zip" -d "$RUNNER_TEMP/periphery"
          chmod +x "$RUNNER_TEMP/periphery/periphery"
          echo "$RUNNER_TEMP/periphery" >> "$GITHUB_PATH"

      - name: Check Unused Code
        run: periphery scan --relative-results --skip-build --index-store-path build/Index.noindex/DataStore

      - name: Upload Squirrel artifact
        uses: actions/upload-artifact@v6
        with:
          name: Squirrel-${{ env.git_ref_name }}.zip
          path: package/*.pkg
          # keep 90 days
          retention-days: 90
